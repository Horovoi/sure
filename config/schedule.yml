import_market_data:
  cron: "0 22 * * 1-5" # 5:00 PM EST / 6:00 PM EDT (NY time) Monday through Friday
  class: "ImportMarketDataJob"
  queue: "scheduled"
  active_job: true
  description: "Imports market data daily at 5:00 PM EST (1 hour after market close)"
  args:
    mode: "full"
    clear_cache: false

reap_stale_work:
  cron: "15 * * * *" # hourly, off the sync_hourly minute
  class: "StaleWorkReaperJob"
  queue: "scheduled"
  active_job: true
  description: "Moves syncs, imports, rule runs and other work stuck in progress to a final state"

clean_up_recurring_transactions:
  cron: "30 3 * * *" # daily at 03:30 UTC
  class: "CleanUpRecurringTransactionsJob"
  queue: "scheduled"
  active_job: true
  description: "Marks stale recurring transactions inactive and removes old inactive patterns"

sync_hourly:
  cron: "0 * * * *" # every hour at the top of the hour
  class: "SyncHourlyJob"
  queue: "scheduled"
  active_job: true
  description: "Syncs provider items that opt-in to hourly syncing"

clean_debug_log_entries:
  cron: "45 3 * * *" # daily at 03:45 UTC
  class: "DebugLogCleanupJob"
  queue: "scheduled"
  active_job: true
  description: "Deletes debug log entries older than DEBUG_LOG_RETENTION_DAYS (90 by default)"

# clean_data, run_security_health_checks and generate_subscription_transactions are
# scheduled from Settings by ScheduledJobsManager at every Sidekiq start; do not add
# them here, or this file overwrites the configured times on every boot.

full_backup:
  cron: "0 4 * * * Europe/Kyiv" # daily at 04:00 Kyiv time
  class: "FullBackupJob"
  queue: "scheduled"
  active_job: true
  description: "Writes the daily backup bundle (database, files, icons, encrypted env) and mirrors it off-site"

# Savings goals (w2-goals). Daily; the job itself acts only on each family's first day
# of a fiscal month, in the family's time zone.
refresh_maintained_goal_targets:
  cron: "0 3 * * *" # daily at 03:00 UTC
  class: "RefreshMaintainedGoalTargetsJob"
  queue: "scheduled"
  active_job: true
  description: "Recomputes the target of reserves set in months of expenses on the first day of each fiscal month"

# Insights feed (w3-reports). Nightly after the backup; the job fans out one run per
# family, each in the family's time zone.
generate_insights:
  cron: "30 4 * * * Europe/Kyiv" # daily at 04:30 Kyiv time
  class: "GenerateInsightsJob"
  queue: "scheduled"
  active_job: true
  description: "Writes the dashboard insights feed (budget, cash flow, idle cash, net worth, savings rate, spending) from templates"
