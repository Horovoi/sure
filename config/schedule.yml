import_market_data:
  cron: "0 22 * * 1-5" # 5:00 PM EST / 6:00 PM EDT (NY time) Monday through Friday
  class: "ImportMarketDataJob"
  queue: "scheduled"
  description: "Imports market data daily at 5:00 PM EST (1 hour after market close)"
  args:
    mode: "full"
    clear_cache: false
  
reap_stale_work:
  cron: "15 * * * *" # hourly, off the sync_hourly minute
  class: "StaleWorkReaperJob"
  queue: "scheduled"
  description: "Moves syncs, imports, rule runs and other work stuck in progress to a final state"

clean_up_recurring_transactions:
  cron: "30 3 * * *" # daily at 03:30 UTC
  class: "CleanUpRecurringTransactionsJob"
  queue: "scheduled"
  description: "Marks stale recurring transactions inactive and removes old inactive patterns"

sync_hourly:
  cron: "0 * * * *" # every hour at the top of the hour
  class: "SyncHourlyJob"
  queue: "scheduled"
  description: "Syncs provider items that opt-in to hourly syncing"

clean_debug_log_entries:
  cron: "45 3 * * *" # daily at 03:45 UTC
  class: "DebugLogCleanupJob"
  queue: "scheduled"
  active_job: true
  description: "Deletes debug log entries older than DEBUG_LOG_RETENTION_DAYS (90 by default)"

# clean_data, run_security_health_checks and generate_subscription_transactions are
# scheduled from Settings by ScheduledJobsManager at every Sidekiq start; do not add
# them here, or this file overwrites the configured times on every boot.
