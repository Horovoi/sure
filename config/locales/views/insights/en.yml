---
en:
  pages:
    dashboard:
      insights_feed:
        title: Insights
  settings:
    hostings:
      scheduled_jobs_settings:
        status:
          job_names:
            generate_insights: Nightly insights
  insights:
    index:
      title: Insights
      subtitle: What stands out in your finances this fiscal month. Sure checks every night.
      empty:
        title: Nothing stands out right now
        description: Insights appear here when a budget runs close to its limit, spending moves away from normal, cash may run low, or a milestone is reached. Sure checks every night.
    feed:
      header: Worth a look
      view_all:
        one: View all
        other: View all %{count}
      all_caught_up: All caught up. Sure checks again tonight.
    insight:
      dismiss: Got it
      dismiss_title: Hide this until the numbers change
      dismiss_aria: "Got it: %{title}"
      dig_in: Dig in with AI
    undo_toast:
      dismissed: Insight hidden
      undo: Undo
      close: Close
    dig_in:
      prompt: |-
        Help me dig into this insight.

        Insight: %{title}
        What Sure found: %{body}
        Period: %{period}
        Figures:
        %{facts}

        What is behind it, and is there anything I should do?
      no_period: none
      no_facts: "- none"
    kinds:
      spending_anomaly: Spending
      cash_flow_warning: Cash flow
      net_worth_milestone: Net worth
      savings_rate_change: Savings rate
      idle_cash: Idle cash
      budget_at_risk: Budget
      budget_on_track: Budget
      maintained_goal_depleted: Reserve
    meta:
      next_n_days:
        one: Next day
        other: Next %{count} days
      date_range: "%{from} to %{to}"
    figures:
      points: "%{value} pp"
      vs_previous: vs the month before
      today: today
      so_far: so far
      of_budget: of budget
      need_attention: need attention
      short: short
      idle_days:
        one: idle %{count} day
        other: idle %{count} days
    actions:
      spending_anomaly: View %{category} transactions
      cash_flow_warning: Review subscriptions
      net_worth_milestone: View reports
      savings_rate_change: View that month's transactions
      idle_cash: Go to account
      budget: View budget
      maintained_goal_depleted: View reserve
    titles:
      spending_anomaly:
        above: "%{category} spending is above normal"
        below: "%{category} spending is below normal"
      cash_flow_warning:
        low: Your cash may run low
        negative: Your cash may go negative
      net_worth_milestone: "Net worth passed %{milestone}"
      savings_rate_change:
        up: Your savings rate went up in %{month}
        down: Your savings rate went down in %{month}
        down_negative: You spent more than you earned in %{month}
      idle_cash: Idle cash in %{account}
      budget_at_risk:
        over:
          one: One category is over budget
          other: "%{count} categories need attention in your budget"
        near:
          one: One category is close to its limit
          other: "%{count} categories are close to their limits"
      budget_on_track: Your budget is on track
      maintained_goal_depleted: "%{goal} has dropped below its level"
    templates:
      spending_anomaly:
        above: In the first %{days} days of this fiscal month you spent %{spent} on %{category}, about %{deviation_pct}% more than the %{normal} that is normal by this day.
        below: In the first %{days} days of this fiscal month you spent %{spent} on %{category}, about %{deviation_pct}% less than the %{normal} that is normal by this day.
      cash_flow_warning:
        low: With your typical income, upcoming subscriptions and typical spending, your cash of %{current_balance} could drop to %{projected_low} around %{projected_low_date}.
        negative: With your typical income, upcoming subscriptions and typical spending, your cash of %{current_balance} could fall to %{projected_low} around %{projected_low_date}.
      net_worth_milestone: Your net worth passed %{milestone} this fiscal month and is now %{net_worth}.
      savings_rate_change:
        up: You saved %{current_rate}% of your income in %{month}, up %{change_pp} percentage points from %{previous_rate}% the month before.
        down: You saved %{current_rate}% of your income in %{month}, down %{change_pp} percentage points from %{previous_rate}% the month before.
        down_negative: "Your savings rate in %{month} was %{current_rate}%, down from %{previous_rate}% the month before."
      idle_cash: "%{account} holds %{balance} and has had no activity in the last %{idle_days} days."
      budget_at_risk:
        over: "%{categories}: over budget this fiscal month. You have used %{budget_spent_pct}% of your total budget so far."
        near: "%{categories}: close to the limit this fiscal month. You have used %{budget_spent_pct}% of your total budget so far."
      budget_on_track: You have spent %{spent} of your %{budgeted} budget (%{budget_spent_pct}%), and every category is within its limit.
      maintained_goal_depleted: "%{goal} holds %{saved} of the %{target} it is meant to keep. It is %{missing} short."
