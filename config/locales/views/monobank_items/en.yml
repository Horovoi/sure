      waiting_for_client_info: monobank answers one request a minute. Your accounts load in a minute.
    new:
      title: Connect monobank
      subtitle: Use a personal token from api.monobank.ua
    create:
      success: monobank connected. Your accounts load in a minute.
    update:
      success: monobank connection saved.
    destroy:
      success: monobank disconnected. The linked accounts are manual accounts now.
      unlink_failed: Some accounts could not be unlinked, so the connection was kept. Try again.
    setup_accounts:
      title: Set up monobank accounts
      subtitle: Choose what each monobank account becomes in Sure.
