      windows_left:
        one: "1 statement page left to fetch (about %{minutes} min)"
        other: "%{count} statement pages left to fetch (about %{minutes} min)"
    panel:
      steps_title: "To connect monobank:"
      step_1_html: Open %{link}, sign in with the QR code in the monobank app and copy your personal token.
      step_2: Paste the token below and connect.
      step_3: Set up accounts to link each card, currency account, FOP account and jar to a Sure account. A jar with a target also becomes a goal.
      rate_limit_notice: monobank answers one request per minute. The first import of a year of history takes about an hour per product; new transactions arrive every hour.
      disconnect: Disconnect
      disconnect_title: Disconnect %{name}?
      disconnect_body: The linked accounts stay in Sure with their history and become manual accounts. The token is deleted.
      linked_to: Linked to %{account}
      skipped: Skipped
      not_linked: Not set up
      jar_goal: "goal %{goal}"
      setup_accounts: Set up accounts
      sync_now: Sync now
      add_connection: Add another connection
    monobank_item:
      sync_now: Sync now
      settings: Connection settings
      setup_needed: Accounts to set up
