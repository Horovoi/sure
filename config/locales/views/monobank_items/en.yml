      nothing_to_set_up_hint: New cards and jars show up here after a sync.
      choice_label: In Sure
      cutover_label: Take over from
      cutover_text: Leave it empty to start the day after the chosen account's latest entry (for %{account}, %{date}); earlier history stays as you entered it.
      cutover_hint: Leave it empty to start the day after the chosen account's latest entry; earlier history stays as you entered it. Pick another day here if you want.
      jar_goal_hint: "Its target of %{goal} becomes a goal funded by this account."
      cancel: Cancel
      submit: Save
    complete_account_setup:
      success: "Done: %{created} created, %{linked} linked, %{skipped} skipped."
      product_failed: "%{name}: %{error}"
    select_accounts:
