en:
  monobank_items:
    connection_form:
      name_label: Connection name
      token_label: Personal token
      token_placeholder: Paste the token from api.monobank.ua
      token_keep_placeholder: Leave empty to keep the saved token
      history_start_label: Import history from
      history_start_hint: Leave empty to import the last %{days} days. Accounts you link to an account you already keep start where your own entries end.
      include_pending_label: Import pending holds
      include_pending_hint: Card payments that are not settled yet show as pending until monobank settles them.
      apply_mcc_label: Categorise by MCC
      apply_mcc_hint: Uncategorised transactions get a category from the merchant code. Your rules and your own categories always win.
      connect: Connect monobank
      save: Save
