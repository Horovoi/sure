              split_parent_locked: This transaction is split. Unsplit it to change its
                amount, account or excluded setting.
              split_child_not_deletable: A part of a split is removed in the split editor,
                or by unsplitting the transaction
        entry_split_blockers:
          not_transaction: Only a transaction can be split
          already_split: This transaction is split already
          split_child: A part of a split cannot be split again
          excluded: An excluded transaction cannot be split. Include it first.
          zero_amount: A transaction of 0 cannot be split
          transfer: A transfer, a transfer leg or a transfer fee cannot be split
          kind: Only a regular or one-time transaction can be split
