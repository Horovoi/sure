              anchor_on_reconciliation_date: This date holds the account's opening or current
                balance. Edit that entry, or pick another date.
              duplicate_anchor: This account already has an entry of this kind
              split_too_few_parts: A split needs at least two parts
              split_too_many_parts: A split can have at most 20 parts
              split_invalid_amount: Every part needs an amount other than 0
              split_sum_mismatch: The parts add up to %{actual}, not to the transaction's
