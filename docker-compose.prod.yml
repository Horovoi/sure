# Production on this machine. Started by bin/deploy; see `bin/deploy --help`.
#
# The same file also runs the staging copy (bin/staging), under a different
# project name and with docker-compose.staging.yml layered on top.

# Fixed project name: the data volumes are named after it (sure_postgres-data, ...).
name: sure

x-db-env: &db_env
  POSTGRES_USER: ${POSTGRES_USER:-sure_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  # Must be set in .env.production
  POSTGRES_DB: ${POSTGRES_DB:-sure_production}

x-rails-env: &rails_env
  <<: *db_env
  SECRET_KEY_BASE: ${SECRET_KEY_BASE}
  SELF_HOSTED: "true"
  RAILS_FORCE_SSL: "false"  # Set to true if using HTTPS
  RAILS_ASSUME_SSL: "false"
  DB_HOST: db
  DB_PORT: 5432
  REDIS_URL: redis://redis:6379/1
  PORT: ${CONTAINER_PORT:-3333}
  TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY}
  OPENAI_ACCESS_TOKEN: ${OPENAI_ACCESS_TOKEN:-}
  # SMTP Configuration
  SMTP_ADDRESS: ${SMTP_ADDRESS}
  SMTP_PORT: ${SMTP_PORT}
  SMTP_USERNAME: ${SMTP_USERNAME}
  SMTP_PASSWORD: ${SMTP_PASSWORD}
  SMTP_TLS_ENABLED: ${SMTP_TLS_ENABLED:-}
  EMAIL_SENDER: ${EMAIL_SENDER:-}
  # Brand Fetch (for logos/icons)
  BRAND_FETCH_CLIENT_ID: ${BRAND_FETCH_CLIENT_ID}
  BRAND_FETCH_HIGH_RES_LOGOS: ${BRAND_FETCH_HIGH_RES_LOGOS:-false}

services:
  # Each container is named <project>-<service> (sure-web, sure-staging-web). Without
  # container_name Compose appends a replica number (sure-web-1), which means nothing
  # here: every service runs exactly one container.
  web:
    container_name: ${COMPOSE_PROJECT_NAME}-web
    # Built locally by bin/deploy and tagged with the commit it was built from
    image: sure:${BUILD_COMMIT_SHA:-latest}
    build:
      context: .
      args:
        BUILD_COMMIT_SHA: ${BUILD_FULL_SHA:-}
    volumes:
      - app-storage:/rails/storage
      # Subscription icons cached by the app; kept across deploys
      - icons:/rails/public/icons
    ports:
      - "${PORT:-3333}:${CONTAINER_PORT:-3333}"
    restart: unless-stopped
    environment:
      <<: *rails_env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sure_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${CONTAINER_PORT:-3333}/up || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    container_name: ${COMPOSE_PROJECT_NAME}-worker
    # Same image as web; never pulled from a registry
    image: sure:${BUILD_COMMIT_SHA:-latest}
    pull_policy: never
    command: bundle exec sidekiq
    # Sidekiq needs up to 25 s (its default shutdown timeout) to hand running jobs
    # back to Redis. Docker's default 10 s grace period killed them mid-run on every
    # deploy, leaving syncs, imports and rule runs stuck.
    stop_grace_period: 35s
    volumes:
      - app-storage:/rails/storage
      # Subscription icons cached by the app; kept across deploys
      - icons:/rails/public/icons
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      <<: *rails_env
      # Worker threads (and its DB pool): 3 for the default lane, 2 for the AI lane
      # (config/sidekiq.yml). Puma (web) keeps its own default of 3.
      RAILS_MAX_THREADS: 5
      RAILS_AI_MAX_THREADS: 2
    networks:
      - sure_net

  db:
    container_name: ${COMPOSE_PROJECT_NAME}-db
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      <<: *db_env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sure_net

  redis:
    container_name: ${COMPOSE_PROJECT_NAME}-redis
    image: redis:latest
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sure_net

  backup:
    container_name: ${COMPOSE_PROJECT_NAME}-backup
    image: prodrigestivill/postgres-backup-local
    restart: unless-stopped
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB:-sure_production}
      - POSTGRES_USER=${POSTGRES_USER:-sure_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SCHEDULE=${BACKUP_SCHEDULE:-@daily}
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-7}
      - BACKUP_KEEP_WEEKS=${BACKUP_KEEP_WEEKS:-4}
      - BACKUP_KEEP_MONTHS=${BACKUP_KEEP_MONTHS:-6}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sure_net

volumes:
  app-storage:
  icons:
  postgres-data:
  redis-data:

networks:
  sure_net:
    driver: bridge
